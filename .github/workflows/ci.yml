name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          REQ=$(find . -name "requirements*.txt" -not -path "./.git/*" | head -n 1)
          if [ -n "$REQ" ]; then
            echo "Installing from $REQ"
            pip install -r "$REQ"
          else
            echo "No requirements file found - installing core packages"
            pip install fastapi uvicorn
          fi
          pip install ruff pytest

      - name: Lint
        run: ruff check . --exit-zero

      - name: Check code compiles
        run: python -m compileall -q -x '(\.git|venv|\.venv)' .

      - name: Run tests
        run: |
          if [ -d tests ]; then pytest -q; else echo "No tests yet"; fi

      - name: Build Docker image
        run: |
          if [ -f Dockerfile ]; then docker build -t rag-platform .; else echo "No Dockerfile"; fi
